<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miro.AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Markdown & Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --bg: #000000;
            --text-primary: #FFFFFF;
            --text-secondary: #888888;
            --border: #333333;
            --border-hover: #555555;
            --surface: #0a0a0a;
            --surface-hover: #141414;
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-pill: 999px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --max-width: 768px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            height: 100dvh;
            display: flex;
            overflow: hidden;
        }

        /* Typography */
        h1, h2, h3 { font-weight: 500; }
        a { color: var(--text-primary); text-decoration: underline; text-underline-offset: 4px; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-pill); }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* Layout */
        #app {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Sidebar (History) */
        #sidebar {
            width: 280px;
            height: 100%;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform var(--transition);
            position: absolute;
            z-index: 100;
        }
        #sidebar.open { transform: translateX(0); }
        
        .sidebar-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); }
        .icon-btn {
            background: transparent; border: none; color: var(--text-secondary);
            cursor: pointer; padding: 8px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            transition: all var(--transition);
        }
        .icon-btn:hover { color: var(--text-primary); background: var(--surface-hover); }

        .history-list {
            flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px;
        }
        .history-item {
            padding: 12px 16px; border-radius: var(--radius-md); cursor: pointer;
            font-size: 0.9rem; color: var(--text-secondary); transition: all var(--transition);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .history-item:hover { background: var(--surface-hover); color: var(--text-primary); }
        .history-item.active { background: var(--border); color: var(--text-primary); }

        /* Main Content */
        #main {
            flex: 1; display: flex; flex-direction: column; height: 100%; position: relative;
            transition: margin-left var(--transition);
        }

        /* Header */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; z-index: 10;
        }
        .brand { font-weight: 600; font-size: 1.1rem; letter-spacing: -0.5px; }
        
        /* Model Selector */
        .model-selector-wrapper { position: relative; }
        .model-selector-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text-primary);
            padding: 8px 16px; border-radius: var(--radius-pill); font-size: 0.85rem; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all var(--transition);
        }
        .model-selector-btn:hover { border-color: var(--border-hover); background: var(--surface); }
        
        .model-dropdown {
            position: absolute; top: calc(100% + 8px); right: 0; width: 260px;
            background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 8px; display: none; flex-direction: column; gap: 4px; z-index: 50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; transform: translateY(-10px);
            transition: all var(--transition);
        }
        .model-dropdown.show { display: flex; opacity: 1; transform: translateY(0); }
        
        .model-option {
            padding: 12px 16px; border-radius: var(--radius-sm); cursor: pointer;
            display: flex; flex-direction: column; gap: 4px; border: 1px solid transparent;
            transition: all var(--transition);
        }
        .model-option:hover { background: var(--surface); }
        .model-option.active { border-color: var(--border); background: var(--surface-hover); }
        .model-name { font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .model-desc { font-size: 0.75rem; color: var(--text-secondary); }

        /* Chat Area */
        #chat-container {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column;
            scroll-behavior: smooth;
        }
        .chat-wrapper {
            width: 100%; max-width: var(--max-width); margin: 0 auto; display: flex; flex-direction: column; gap: 32px; padding-bottom: 40px;
        }

        /* Empty State */
        .empty-state {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; max-width: var(--max-width); margin: 0 auto; width: 100%;
        }
        .empty-title { font-size: 2rem; font-weight: 400; margin-bottom: 40px; letter-spacing: -1px; }
        .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 600px; }
        .suggestion-card {
            background: transparent; border: 1px solid var(--border); padding: 16px;
            border-radius: var(--radius-md); cursor: pointer; text-align: left;
            transition: all var(--transition); color: var(--text-secondary); font-size: 0.9rem;
        }
        .suggestion-card:hover { border-color: var(--text-primary); color: var(--text-primary); }

        /* Messages */
        .message { display: flex; flex-direction: column; gap: 8px; opacity: 0; animation: fadeIn 0.3s forwards; }
        .message-role { font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 1px; font-weight: 500; }
        .message-content { font-size: 1rem; color: var(--text-primary); }
        
        .message.user .message-content { color: var(--text-secondary); }
        .message.assistant .message-content { color: var(--text-primary); }

        /* Markdown Styles */
        .markdown-body { line-height: 1.7; }
        .markdown-body p { margin-bottom: 1em; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body pre {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 16px; margin: 1em 0; overflow-x: auto; position: relative;
        }
        /* Override Highlight.js background */
        .hljs { background: transparent !important; padding: 0 !important; }
        .markdown-body code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 0.85em; }
        .markdown-body p code { background: var(--surface); padding: 2px 6px; border-radius: 4px; }
        .copy-code-btn {
            position: absolute; top: 8px; right: 8px; background: var(--border); color: var(--text-primary);
            border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer;
            opacity: 0; transition: opacity var(--transition);
        }
        .markdown-body pre:hover .copy-code-btn { opacity: 1; }
        .copy-code-btn:active { background: var(--border-hover); }

        /* Composer */
        .composer-container {
            width: 100%; max-width: var(--max-width); margin: 0 auto; padding: 0 20px 32px 20px;
            position: relative;
        }
        .composer {
            background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
            padding: 12px 16px; display: flex; align-items: flex-end; gap: 12px;
            transition: border-color var(--transition); box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .composer:focus-within { border-color: var(--border-hover); }
        
        textarea {
            flex: 1; background: transparent; border: none; color: var(--text-primary);
            font-family: inherit; font-size: 1rem; resize: none; max-height: 200px;
            padding: 4px 0; outline: none; line-height: 1.5;
        }
        textarea::placeholder { color: var(--text-secondary); }
        
        .action-btn {
            width: 32px; height: 32px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all var(--transition); flex-shrink: 0;
        }
        .send-btn { background: var(--text-primary); color: var(--bg); }
        .send-btn:hover:not(:disabled) { background: #e0e0e0; transform: scale(1.05); }
        .send-btn:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; transform: none; }
        
        .stop-btn { background: transparent; border: 1px solid var(--border); color: var(--text-primary); display: none; }
        .stop-btn:hover { background: var(--surface-hover); }

        /* Loading / Generating Indicator */
        .cursor { display: inline-block; width: 8px; height: 16px; background: var(--text-primary); animation: blink 1s step-end infinite; vertical-align: middle; margin-left: 4px; }
        
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive */
        @media (min-width: 768px) {
            #sidebar { position: static; transform: none; display: flex; width: 260px; margin-left: -260px; }
            #sidebar.open { margin-left: 0; }
            .header-left .menu-btn { display: none; } /* Hide hamburger on desktop if sidebar is toggleable differently, but let's keep it for manual toggle */
        }
        @media (max-width: 767px) {
            .suggestions { grid-template-columns: 1fr; }
            .composer-container { padding: 0 16px 20px 16px; }
            .empty-title { font-size: 1.5rem; }
        }

        /* Overlay for mobile sidebar */
        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 90; display: none; opacity: 0;
            transition: opacity var(--transition); backdrop-filter: blur(2px);
        }
        .overlay.show { display: block; opacity: 1; }

    </style>
</head>
<body>

<div id="app">
    <!-- Overlay for mobile -->
    <div id="overlay" class="overlay"></div>

    <!-- Sidebar History -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">History</span>
            <button class="icon-btn" id="new-chat-btn" aria-label="New Chat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </div>
        <div class="history-list" id="history-list">
            <!-- History items injected via JS -->
        </div>
    </aside>

    <!-- Main View -->
    <main id="main">
        <header>
            <div class="header-left" style="display: flex; align-items: center; gap: 16px;">
                <button class="icon-btn menu-btn" id="toggle-sidebar" aria-label="Menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="brand">MIRO.AI</div>
            </div>
            
            <div class="model-selector-wrapper">
                <button class="model-selector-btn" id="model-btn">
                    <span id="current-model-label">Auto</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="model-dropdown" id="model-dropdown">
                    <div class="model-option active" data-model="auto">
                        <div class="model-name">Auto</div>
                        <div class="model-desc">Automatically chooses the best model</div>
                    </div>
                    <div class="model-option" data-model="qwen-max">
                        <div class="model-name">Qwen3.8 Max</div>
                        <div class="model-desc">General reasoning and conversation</div>
                    </div>
                    <div class="model-option" data-model="qwen-coder">
                        <div class="model-name">Qwen3 Coder Plus</div>
                        <div class="model-desc">Programming and technical tasks</div>
                    </div>
                </div>
            </div>
        </header>

        <div id="chat-container">
            <!-- Empty State (Shown initially) -->
            <div class="empty-state" id="empty-state">
                <h1 class="empty-title">How can I help?</h1>
                <div class="suggestions">
                    <button class="suggestion-card">Explain quantum computing simply</button>
                    <button class="suggestion-card">Write a Python script for web scraping</button>
                    <button class="suggestion-card">Brainstorm marketing ideas</button>
                    <button class="suggestion-card">Analyze this sorting algorithm</button>
                </div>
            </div>

            <!-- Chat Messages -->
            <div class="chat-wrapper" id="chat-wrapper" style="display: none;">
                <!-- Messages injected via JS -->
            </div>
        </div>

        <!-- Composer -->
        <div class="composer-container">
            <div class="composer">
                <textarea id="prompt-input" rows="1" placeholder="Ask Miro..." aria-label="Message"></textarea>
                
                <button class="action-btn stop-btn" id="stop-btn" aria-label="Stop generation">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                </button>
                
                <button class="action-btn send-btn" id="send-btn" aria-label="Send message" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                </button>
            </div>
        </div>
    </main>
</div>

<script>
    /**
     * CONFIGURATION
     * Change this to your deployed backend URL.
     * Leave as is for local development.
     */
    const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
        ? 'http://localhost:3000/api' 
        : 'https://seubackend.exemplo.com/api'; // <--- TODO: Update this when deploying

    /**
     * STATE MANAGEMENT
     */
    const state = {
        model: 'auto',
        isGenerating: false,
        chatId: null,
        history: [], // Array of chat objects { id, title, messages, updatedAt, model }
        messages: [], // Current chat messages
        abortController: null
    };

    /**
     * STORAGE MODULE
     */
    const Storage = {
        KEY: 'miro_history',
        load: () => {
            try { return JSON.parse(localStorage.getItem(Storage.KEY)) || []; } 
            catch { return []; }
        },
        save: (history) => localStorage.setItem(Storage.KEY, JSON.stringify(history))
    };

    /**
     * MARKDOWN CONFIGURATION
     */
    marked.setOptions({
        highlight: function(code, lang) {
            const language = highlight.getLanguage(lang) ? lang : 'plaintext';
            return highlight.highlight(code, { language }).value;
        },
        langPrefix: 'hljs language-',
        breaks: true
    });

    /**
     * DOM ELEMENTS
     */
    const els = {
        sidebar: document.getElementById('sidebar'),
        overlay: document.getElementById('overlay'),
        toggleSidebarBtn: document.getElementById('toggle-sidebar'),
        newChatBtn: document.getElementById('new-chat-btn'),
        historyList: document.getElementById('history-list'),
        modelBtn: document.getElementById('model-btn'),
        modelDropdown: document.getElementById('model-dropdown'),
        currentModelLabel: document.getElementById('current-model-label'),
        modelOptions: document.querySelectorAll('.model-option'),
        emptyState: document.getElementById('empty-state'),
        chatContainer: document.getElementById('chat-container'),
        chatWrapper: document.getElementById('chat-wrapper'),
        promptInput: document.getElementById('prompt-input'),
        sendBtn: document.getElementById('send-btn'),
        stopBtn: document.getElementById('stop-btn'),
        suggestions: document.querySelectorAll('.suggestion-card')
    };

    /**
     * INITIALIZATION
     */
    function init() {
        state.history = Storage.load();
        renderHistory();
        setupEventListeners();
        
        // Open sidebar by default on desktop
        if (window.innerWidth >= 768) els.sidebar.classList.add('open');
    }

    /**
     * EVENT LISTENERS
     */
    function setupEventListeners() {
        // Sidebar Toggles
        els.toggleSidebarBtn.addEventListener('click', toggleSidebar);
        els.overlay.addEventListener('click', toggleSidebar);
        els.newChatBtn.addEventListener('click', startNewChat);

        // Model Selector
        els.modelBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            els.modelDropdown.classList.toggle('show');
        });
        document.addEventListener('click', () => els.modelDropdown.classList.remove('show'));
        
        els.modelOptions.forEach(opt => {
            opt.addEventListener('click', (e) => {
                els.modelOptions.forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                state.model = opt.dataset.model;
                els.currentModelLabel.textContent = opt.querySelector('.model-name').textContent;
            });
        });

        // Composer Auto-resize & Input
        els.promptInput.addEventListener('input', handleInput);
        els.promptInput.addEventListener('keydown', handleKeydown);

        // Actions
        els.sendBtn.addEventListener('click', sendMessage);
        els.stopBtn.addEventListener('click', stopGeneration);

        // Suggestions
        els.suggestions.forEach(btn => {
            btn.addEventListener('click', () => {
                els.promptInput.value = btn.textContent;
                handleInput();
                sendMessage();
            });
        });

        // Copy Code blocks delegation
        els.chatWrapper.addEventListener('click', (e) => {
            if (e.target.classList.contains('copy-code-btn')) {
                const code = e.target.parentElement.querySelector('code').innerText;
                navigator.clipboard.writeText(code);
                const originalText = e.target.textContent;
                e.target.textContent = 'Copied!';
                setTimeout(() => e.target.textContent = originalText, 2000);
            }
        });
    }

    /**
     * UI FUNCTIONS
     */
    function toggleSidebar() {
        const isOpen = els.sidebar.classList.toggle('open');
        if (window.innerWidth < 768) {
            els.overlay.classList.toggle('show', isOpen);
        }
    }

    function handleInput() {
        els.promptInput.style.height = 'auto';
        els.promptInput.style.height = els.promptInput.scrollHeight + 'px';
        els.sendBtn.disabled = els.promptInput.value.trim() === '';
    }

    function handleKeydown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (!els.sendBtn.disabled && !state.isGenerating) {
                sendMessage();
            }
        }
    }

    function startNewChat() {
        if (state.isGenerating) return;
        state.chatId = null;
        state.messages = [];
        els.chatWrapper.innerHTML = '';
        els.chatWrapper.style.display = 'none';
        els.emptyState.style.display = 'flex';
        els.promptInput.value = '';
        handleInput();
        renderHistory();
        if (window.innerWidth < 768) toggleSidebar(); // Close sidebar on mobile
    }

    function loadChat(id) {
        if (state.isGenerating) return;
        const chat = state.history.find(c => c.id === id);
        if (!chat) return;

        state.chatId = chat.id;
        state.messages = [...chat.messages];
        state.model = chat.model || 'auto';
        
        // Update model UI
        els.modelOptions.forEach(o => {
            o.classList.toggle('active', o.dataset.model === state.model);
            if (o.dataset.model === state.model) els.currentModelLabel.textContent = o.querySelector('.model-name').textContent;
        });

        els.emptyState.style.display = 'none';
        els.chatWrapper.style.display = 'flex';
        els.chatWrapper.innerHTML = '';
        
        state.messages.forEach(msg => appendMessageUI(msg.role, msg.content));
        scrollToBottom();
        renderHistory();
        if (window.innerWidth < 768) toggleSidebar();
    }

    function renderHistory() {
        els.historyList.innerHTML = '';
        const sorted = [...state.history].sort((a, b) => b.updatedAt - a.updatedAt);
        
        sorted.forEach(chat => {
            const div = document.createElement('div');
            div.className = `history-item ${chat.id === state.chatId ? 'active' : ''}`;
            div.textContent = chat.title;
            div.onclick = () => loadChat(chat.id);
            els.historyList.appendChild(div);
        });
    }

    function scrollToBottom() {
        els.chatContainer.scrollTop = els.chatContainer.scrollHeight;
    }

    function addCopyButtonsToPre(contentHtml) {
        // A simple hack to add copy buttons via string manipulation before DOM insertion
        return contentHtml.replace(/<pre><code/g, '<pre><button class="copy-code-btn">Copy</button><code');
    }

    function appendMessageUI(role, content) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        
        const roleDiv = document.createElement('div');
        roleDiv.className = 'message-role';
        roleDiv.textContent = role === 'user' ? 'You' : 'Miro';
        
        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content markdown-body';
        
        if (role === 'user') {
            contentDiv.textContent = content; // Plain text for user
        } else {
            const dirtyHtml = marked.parse(content);
            const cleanHtml = DOMPurify.sanitize(dirtyHtml);
            contentDiv.innerHTML = addCopyButtonsToPre(cleanHtml);
        }

        msgDiv.appendChild(roleDiv);
        msgDiv.appendChild(contentDiv);
        els.chatWrapper.appendChild(msgDiv);
        return contentDiv; // Return for streaming updates
    }

    /**
     * CORE LOGIC
     */
    async function sendMessage() {
        const text = els.promptInput.value.trim();
        if (!text || state.isGenerating) return;

        // UI Updates
        els.promptInput.value = '';
        els.promptInput.style.height = 'auto';
        els.sendBtn.disabled = true;
        els.emptyState.style.display = 'none';
        els.chatWrapper.style.display = 'flex';
        
        els.sendBtn.style.display = 'none';
        els.stopBtn.style.display = 'flex';

        // Add User Message
        const userMsg = { role: 'user', content: text };
        state.messages.push(userMsg);
        appendMessageUI('user', text);
        scrollToBottom();

        // Create Chat ID and Title if new
        if (!state.chatId) {
            state.chatId = Date.now().toString();
            const title = text.split(' ').slice(0, 5).join(' ') + (text.length > 30 ? '...' : '');
            state.history.push({
                id: state.chatId,
                title: title,
                messages: [...state.messages],
                model: state.model,
                updatedAt: Date.now()
            });
            renderHistory();
        } else {
            updateHistoryStorage();
        }

        // Prepare Assistant Message UI
        const assistantContentDiv = appendMessageUI('assistant', '');
        assistantContentDiv.innerHTML = '<span class="cursor"></span>';
        scrollToBottom();

        // API Call
        state.isGenerating = true;
        state.abortController = new AbortController();
        let fullResponse = '';

        try {
            const response = await fetch(`${API_BASE_URL}/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: state.messages,
                    model: state.model
                }),
                signal: state.abortController.signal
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error || 'Something went wrong.');
            }

            // Read Stream
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n').filter(line => line.trim() !== '');
                
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const dataStr = line.replace('data: ', '');
                        if (dataStr === '[DONE]') continue;
                        
                        try {
                            const parsed = JSON.parse(dataStr);
                            const token = parsed.choices[0]?.delta?.content || '';
                            fullResponse += token;
                            
                            // Render incrementally
                            const dirtyHtml = marked.parse(fullResponse);
                            const cleanHtml = DOMPurify.sanitize(dirtyHtml);
                            assistantContentDiv.innerHTML = addCopyButtonsToPre(cleanHtml) + '<span class="cursor"></span>';
                            
                            // Auto scroll if user is at the bottom
                            if (els.chatContainer.scrollHeight - els.chatContainer.scrollTop - els.chatContainer.clientHeight < 100) {
                                scrollToBottom();
                            }
                        } catch (e) {
                            console.error('Error parsing stream:', e);
                        }
                    }
                }
            }
        } catch (error) {
            if (error.name !== 'AbortError') {
                fullResponse = `_Error: ${error.message}_`;
                assistantContentDiv.innerHTML = DOMPurify.sanitize(marked.parse(fullResponse));
            }
        } finally {
            state.isGenerating = false;
            els.stopBtn.style.display = 'none';
            els.sendBtn.style.display = 'flex';
            
            // Remove cursor and finalize markdown
            const dirtyHtml = marked.parse(fullResponse);
            assistantContentDiv.innerHTML = addCopyButtonsToPre(DOMPurify.sanitize(dirtyHtml));
            
            // Save to state and storage
            if (fullResponse) {
                state.messages.push({ role: 'assistant', content: fullResponse });
                updateHistoryStorage();
            }
        }
    }

    function stopGeneration() {
        if (state.abortController) {
            state.abortController.abort();
            state.isGenerating = false;
        }
    }

    function updateHistoryStorage() {
        const chatIndex = state.history.findIndex(c => c.id === state.chatId);
        if (chatIndex > -1) {
            state.history[chatIndex].messages = [...state.messages];
            state.history[chatIndex].updatedAt = Date.now();
            Storage.save(state.history);
            renderHistory();
        }
    }

    // Run
    init();

</script>
</body>
</html>
